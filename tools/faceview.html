<!doctype html><meta charset="utf-8">
<style>body{margin:0;background:#2a1010}canvas{display:block}</style>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }</script>
<canvas id="c"></canvas>
<script type="module">
// Close-up of every fighter's head: front view and in-game angle. For tuning looks.
import * as THREE from 'three';
import { ROSTER } from '../src/roster.js';
import { buildFighterModel } from '../src/model.js';
import { applyPose, POSE } from '../src/poses.js';

const defs = ROSTER.filter((d) => d.type !== 'log');
const only = new URLSearchParams(location.search).get('id');
const list = only ? defs.filter((d) => d.id === only) : defs;
const W = only ? 900 : 1500, H = only ? 700 : 820;
const r = new THREE.WebGLRenderer({ canvas: document.getElementById('c'), antialias: true });
r.setSize(W, H); r.outputColorSpace = THREE.SRGBColorSpace; r.toneMapping = THREE.ACESFilmicToneMapping; r.toneMappingExposure = 0.95;
const scene = new THREE.Scene(); scene.background = new THREE.Color(0x2a1010);
scene.add(new THREE.HemisphereLight(0xffe0c0, 0x2a0a08, 0.9));
const key = new THREE.DirectionalLight(0xfff0dd, 2.0); key.position.set(-5, 11, 9); scene.add(key);
const cols = only ? 2 : 5, rowGap = 1.3, colGap = 1.9;
const YAW = Math.PI / 2 - 0.38;
list.forEach((d, i) => {
  for (let row = 0; row < 2; row++) {
    const m = buildFighterModel(d);
    applyPose(m.J, POSE.stance);
    const c = only ? row : i % 5, rr = only ? 0 : Math.floor(i / 5) * 2 + row;
    m.root.position.set((c - (cols - 1) / 2) * colGap + (only ? 0 : (row ? 0.45 : -0.45)), -2.07 - (only ? 0 : Math.floor(i / 5) * 2.7) , 0);
    if (row === 1) m.root.rotation.y = -YAW;
    else { m.J.torso.rotation.y = 0; m.J.head.rotation.set(0, 0, 0); }
    scene.add(m.root);
  }
});
const cam = new THREE.OrthographicCamera(-W / 2, W / 2, H / 2, -H / 2, 0.1, 50);
const zoom = only ? 330 : 150;
cam.left = -W / 2 / zoom; cam.right = W / 2 / zoom; cam.top = H / 2 / zoom; cam.bottom = -H / 2 / zoom;
cam.position.set(0, only ? 0 : -1.35, 10); cam.lookAt(0, only ? 0 : -1.35, 0); cam.updateProjectionMatrix();
r.render(scene, cam);
document.title = 'ready';
</script>
